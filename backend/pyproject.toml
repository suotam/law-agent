[project]
name = "law-agent"
version = "0.1.0"
description = "Agentic RAG system for a law firm: FastAPI backend"
authors = [
    { name = "Matouš Neužil", email = "lizuenm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "docling-core[chunking-openai]>=2.90.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-openrouter>=0.2.7",
    "openrouter>=0.11.46",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.10",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
law-agent = "law_agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
# "importmode=importlib" + rootdir on sys.path lets test modules import the
# shared `tests.conftest` helpers without an __init__.py.
addopts = "-q --import-mode=importlib"
pythonpath = ["."]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
# Ruff 0.16's default rule set already includes B, UP, SIM, PL, and many others.
# The categories below are only the ones not included in the default set.
extend-select = [
    "I",    # isort - import sorting
    "N",    # pep8-naming
    "RUF",  # Ruff-specific rules
    "PTH",  # prefer pathlib over os.path
    "ARG",  # unused arguments
    "ASYNC",# async code pitfalls
]
ignore = [
    "E501",   # line length is handled by the formatter
    "COM812", # conflicts with the formatter
    # Czech legal text and citations legitimately use en dashes and typographic
    # quotes; these rules only make sense for ASCII-only codebases.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["law_agent"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- pyright

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
